<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The bridge's shairport-sync instances take remote-control commands (pause, play, volume)
     for the sender over D-Bus. Each owns a name like org.gnome.ShairportSync.wohnzimmer. -->
<busconfig>
  <policy user="raumfeld-airplay">
    <allow own_prefix="org.gnome.ShairportSync"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.gnome.ShairportSync"/>
    <allow send_path="/org/gnome/ShairportSync"/>
    <allow receive_sender="org.gnome.ShairportSync"/>
  </policy>
</busconfig>
